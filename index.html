<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デイリーノート クイック追記</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e6;
    --fg: #1a1a1a;
    --muted: #6b6b76;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --ok: #16a34a;
    --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card: #1c1c1f;
      --border: #2c2c30;
      --fg: #f0f0f2;
      --muted: #9a9aa2;
      --accent: #4f8ef7;
      --accent-fg: #0a0a0c;
      --ok: #4ade80;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 16px) + 16px);
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-size: 1.25rem; margin: 8px 0 2px; }
  .date { font-size: 1.6rem; font-weight: 700; margin: 4px 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.98rem;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; width: 100%; }
  button.primary:disabled { opacity: 0.5; }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 10px; font-size: 0.85rem; }
  textarea, input[type=text], input[type=password] {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
  }
  textarea { min-height: 72px; resize: vertical; margin-bottom: 10px; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin: 10px 0 4px; }
  .status { font-size: 0.88rem; margin: 4px 0 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  ul.zatsukan { margin: 0; padding-left: 20px; font-size: 0.92rem; }
  ul.zatsukan li { margin-bottom: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  #settingsPanel { display: none; }
  #settingsPanel.open { display: block; }
</style>
</head>
<body>

  <div class="row">
    <h1>📓 デイリーノート クイック追記</h1>
    <button class="ghost" id="toggleSettings">⚙️ 設定</button>
  </div>

  <div id="settingsPanel" class="card">
    <label>Personal Access Token</label>
    <input type="password" id="cfgToken" placeholder="github_pat_...">
    <label>Owner (ユーザー名/Organization)</label>
    <input type="text" id="cfgOwner" placeholder="yamaki4152-lab">
    <label>Repository</label>
    <input type="text" id="cfgRepo" placeholder="my-knowledge-brain">
    <label>Branch</label>
    <input type="text" id="cfgBranch" placeholder="main">
    <label>Vaultフォルダ(リポジトリ内のサブフォルダ)</label>
    <input type="text" id="cfgBasePath" placeholder="知識メモ">
    <div style="margin-top:12px;">
      <button class="primary" id="saveSettings">設定を保存</button>
    </div>
    <p style="font-size:0.78rem;color:var(--muted);margin-top:10px;">
      設定はこの端末のブラウザ内(localStorage)にのみ保存されます。どこにも送信されません。
    </p>
  </div>

  <div class="date" id="dateDisplay">-</div>
  <div class="status" id="loadStatus">読み込み中...</div>

  <div class="card">
    <label>雑感に追加</label>
    <textarea id="newEntry" placeholder="今日の一言を入力"></textarea>
    <button class="primary" id="addBtn">雑感に追加してコミット</button>
    <div class="status" id="addStatus"></div>
    <details>
      <summary>現在の雑感を見る</summary>
      <ul class="zatsukan" id="zatsukanList"></ul>
    </details>
  </div>

  <div class="card">
    <details id="rawDetails">
      <summary>生データを直接編集(上級者向け)</summary>
      <textarea id="rawContent" style="min-height:220px;margin-top:10px;font-family:ui-monospace,monospace;font-size:0.85rem;"></textarea>
      <button class="primary" id="commitRawBtn" style="margin-top:8px;">この内容でコミット</button>
      <div class="status" id="rawStatus"></div>
    </details>
  </div>

<script>
const LS_KEYS = ['ghdn_token','ghdn_owner','ghdn_repo','ghdn_branch','ghdn_basePath'];

function getCfg() {
  return {
    token: localStorage.getItem('ghdn_token') || '',
    owner: localStorage.getItem('ghdn_owner') || '',
    repo: localStorage.getItem('ghdn_repo') || '',
    branch: localStorage.getItem('ghdn_branch') || 'main',
    basePath: localStorage.getItem('ghdn_basePath') || '',
  };
}

function isConfigured() {
  const c = getCfg();
  return c.token && c.owner && c.repo;
}

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function notePath() {
  const c = getCfg();
  const prefix = c.basePath ? c.basePath.replace(/^\/+|\/+$/g, '') + '/' : '';
  return `${prefix}${todayStr()}.md`;
}

function apiUrl(path) {
  const c = getCfg();
  const encoded = path.split('/').map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encoded}`;
}

function authHeaders() {
  const c = getCfg();
  return {
    'Authorization': `Bearer ${c.token}`,
    'Accept': 'application/vnd.github+json',
  };
}

function b64EncodeUnicode(str) {
  const utf8 = unescape(encodeURIComponent(str));
  let binary = '';
  for (let i = 0; i < utf8.length; i++) binary += String.fromCharCode(utf8.charCodeAt(i));
  return btoa(binary);
}

function b64DecodeUnicode(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  let percentEncoded = '';
  for (let i = 0; i < binary.length; i++) {
    percentEncoded += '%' + ('00' + binary.charCodeAt(i).toString(16)).slice(-2);
  }
  return decodeURIComponent(percentEncoded);
}

let currentSha = null;
let currentContent = '';
let noteExists = false;

async function loadTodayNote() {
  const statusEl = document.getElementById('loadStatus');
  if (!isConfigured()) {
    statusEl.textContent = '⚙️ まず設定を入力してください';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '読み込み中...';
  statusEl.className = 'status';
  const c = getCfg();
  try {
    const res = await fetch(`${apiUrl(notePath())}?ref=${encodeURIComponent(c.branch)}`, {
      headers: authHeaders(),
    });
    if (res.status === 200) {
      const json = await res.json();
      currentSha = json.sha;
      currentContent = b64DecodeUnicode(json.content);
      noteExists = true;
      statusEl.textContent = '✅ 今日のノートを読み込みました';
      statusEl.className = 'status ok';
    } else if (res.status === 404) {
      currentSha = null;
      currentContent = '';
      noteExists = false;
      statusEl.textContent = '📝 今日のノートはまだありません(追加時に新規作成します)';
      statusEl.className = 'status';
    } else {
      const errJson = await res.json().catch(() => ({}));
      statusEl.textContent = `❌ 読み込み失敗 (${res.status}): ${errJson.message || ''}`;
      statusEl.className = 'status err';
      return;
    }
    renderZatsukanList();
    document.getElementById('rawContent').value = currentContent;
  } catch (err) {
    statusEl.textContent = `❌ エラー: ${err.message || err}`;
    statusEl.className = 'status err';
  }
}

function extractZatsukanLines(content) {
  const lines = content.split('\n');
  const idx = lines.findIndex(l => l.trim() === '雑感');
  if (idx === -1) return { lines, headingIdx: -1, bulletEnd: -1, items: [] };
  let end = idx + 1;
  const items = [];
  while (end < lines.length && /^\s*-\s+/.test(lines[end])) {
    items.push(lines[end].replace(/^\s*-\s+/, ''));
    end++;
  }
  return { lines, headingIdx: idx, bulletEnd: end, items };
}

function renderZatsukanList() {
  const { items } = extractZatsukanLines(currentContent);
  const ul = document.getElementById('zatsukanList');
  ul.innerHTML = '';
  if (items.length === 0) {
    ul.innerHTML = '<li style="color:var(--muted);">(まだありません)</li>';
    return;
  }
  for (const item of items) {
    const li = document.createElement('li');
    li.textContent = item;
    ul.appendChild(li);
  }
}

function buildNewNoteTemplate(firstEntry) {
  return `${todayStr()}\n\n---\n\nタスク\n- [ ] \n\n雑感\n- ${firstEntry}\n`;
}

function insertZatsukanEntry(content, text) {
  const { lines, headingIdx, bulletEnd } = extractZatsukanLines(content);
  if (headingIdx === -1) {
    // 雑感セクションが見つからない場合は末尾に追加
    const sep = content.endsWith('\n') ? '' : '\n';
    return content + sep + `\n雑感\n- ${text}\n`;
  }
  const newLines = [...lines];
  newLines.splice(bulletEnd, 0, `- ${text}`);
  return newLines.join('\n');
}

async function commitContent(newContent, sha, statusEl, successMsg) {
  const c = getCfg();
  const body = {
    message: `Update ${todayStr()} via quick tool`,
    content: b64EncodeUnicode(newContent),
    branch: c.branch,
  };
  if (sha) body.sha = sha;

  statusEl.textContent = '送信中...';
  statusEl.className = 'status';

  const res = await fetch(apiUrl(notePath()), {
    method: 'PUT',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  if (res.status === 200 || res.status === 201) {
    const json = await res.json();
    currentSha = json.content.sha;
    currentContent = newContent;
    statusEl.textContent = successMsg;
    statusEl.className = 'status ok';
    noteExists = true;
    renderZatsukanList();
    document.getElementById('rawContent').value = currentContent;
    return true;
  } else {
    const errJson = await res.json().catch(() => ({}));
    statusEl.textContent = `❌ 失敗 (${res.status}): ${errJson.message || ''}`;
    statusEl.className = 'status err';
    return false;
  }
}

async function onAdd() {
  const input = document.getElementById('newEntry');
  const text = input.value.trim();
  const statusEl = document.getElementById('addStatus');
  if (!text) {
    statusEl.textContent = '入力してください';
    statusEl.className = 'status err';
    return;
  }
  if (!isConfigured()) {
    statusEl.textContent = '⚙️ まず設定を入力してください';
    statusEl.className = 'status err';
    return;
  }
  const newContent = noteExists ? insertZatsukanEntry(currentContent, text) : buildNewNoteTemplate(text);
  const ok = await commitContent(newContent, currentSha, statusEl, `✅ 追加しました: ${text}`);
  if (ok) input.value = '';
}

async function onCommitRaw() {
  const text = document.getElementById('rawContent').value;
  const statusEl = document.getElementById('rawStatus');
  if (!isConfigured()) {
    statusEl.textContent = '⚙️ まず設定を入力してください';
    statusEl.className = 'status err';
    return;
  }
  await commitContent(text, currentSha, statusEl, '✅ コミットしました');
}

function loadSettingsIntoForm() {
  const c = getCfg();
  document.getElementById('cfgToken').value = c.token;
  document.getElementById('cfgOwner').value = c.owner;
  document.getElementById('cfgRepo').value = c.repo;
  document.getElementById('cfgBranch').value = c.branch;
  document.getElementById('cfgBasePath').value = c.basePath;
}

function saveSettingsFromForm() {
  localStorage.setItem('ghdn_token', document.getElementById('cfgToken').value.trim());
  localStorage.setItem('ghdn_owner', document.getElementById('cfgOwner').value.trim());
  localStorage.setItem('ghdn_repo', document.getElementById('cfgRepo').value.trim());
  localStorage.setItem('ghdn_branch', document.getElementById('cfgBranch').value.trim() || 'main');
  localStorage.setItem('ghdn_basePath', document.getElementById('cfgBasePath').value.trim());
  document.getElementById('settingsPanel').classList.remove('open');
  loadTodayNote();
}

function handleTabKey(e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const el = e.target;
  const { selectionStart: start, selectionEnd: end, value } = el;

  if (start === end) {
    // 選択なし: カーソル位置にタブを1つ挿入(Shift+Tabなら何もしない)
    if (e.shiftKey) return;
    el.value = value.slice(0, start) + '\t' + value.slice(end);
    el.selectionStart = el.selectionEnd = start + 1;
    return;
  }

  // 複数行選択: 各行の先頭にタブを追加/削除
  const lineStart = value.lastIndexOf('\n', start - 1) + 1;
  let lineEnd = value.indexOf('\n', end - 1);
  if (lineEnd === -1) lineEnd = value.length;

  const block = value.slice(lineStart, lineEnd);
  const lines = block.split('\n');
  let newLines, delta = 0;

  if (e.shiftKey) {
    newLines = lines.map(line => {
      if (line.startsWith('\t')) { delta -= 1; return line.slice(1); }
      const spaceMatch = line.match(/^ {1,4}/);
      if (spaceMatch) { delta -= spaceMatch[0].length; return line.slice(spaceMatch[0].length); }
      return line;
    });
  } else {
    newLines = lines.map(line => { delta += 1; return '\t' + line; });
  }

  const newBlock = newLines.join('\n');
  el.value = value.slice(0, lineStart) + newBlock + value.slice(lineEnd);
  el.selectionStart = start + (e.shiftKey ? Math.min(0, delta) : 1);
  el.selectionEnd = end + delta;
}

document.getElementById('rawContent').addEventListener('keydown', handleTabKey);
document.getElementById('newEntry').addEventListener('keydown', handleTabKey);

document.getElementById('toggleSettings').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.toggle('open');
});
document.getElementById('saveSettings').addEventListener('click', saveSettingsFromForm);
document.getElementById('addBtn').addEventListener('click', onAdd);
document.getElementById('commitRawBtn').addEventListener('click', onCommitRaw);

document.getElementById('dateDisplay').textContent = todayStr();
loadSettingsIntoForm();
if (!isConfigured()) {
  document.getElementById('settingsPanel').classList.add('open');
}
loadTodayNote();
</script>
</body>
</html>
